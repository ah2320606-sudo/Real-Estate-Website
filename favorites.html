<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المفضلة | NOVA</title>
  <meta name="description" content="العقارات التي حفظتها في المفضلة للرجوع إليها لاحقًا." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
</head>
<body>
  <div data-site-header></div>

  <main id="main" tabindex="-1">
    <div class="page-band">
      <div class="container">
        <nav class="breadcrumb" aria-label="مسار التصفح">
          <ol>
            <li><a href="index.html">الرئيسية</a></li>
            <li aria-current="page">المفضلة</li>
          </ol>
        </nav>
        <h1>عقاراتي المفضلة</h1>
        <p>تُحفظ قائمة المفضلة في هذا المتصفح، وتبقى متاحة بعد إعادة تحميل الصفحة.</p>
      </div>
    </div>

    <section class="section favorites-section">
      <div class="container">
        <div class="favorites-summary" data-favorites-summary hidden>
          <p><strong data-favorites-total></strong> في قائمتك</p>
          <a class="btn btn-outline btn-sm" href="properties.html">تصفح المزيد من العقارات</a>
        </div>

        <div class="favorites-grid" data-favorites-grid></div>

        <div class="empty-state" data-favorites-empty hidden>
          <div class="empty-icon" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.4 3-3.2 3-5.5A4.5 4.5 0 0 0 17.5 4 4.8 4.8 0 0 0 12 6a4.8 4.8 0 0 0-5.5-2A4.5 4.5 0 0 0 2 8.5c0 2.3 1.5 4.1 3 5.5l7 7Z"/></svg>
          </div>
          <h2>لا توجد عقارات في المفضلة بعد</h2>
          <p>اضغط على أيقونة القلب في أي عقار لحفظه هنا، ثم عد لمقارنته لاحقًا.</p>
          <a class="btn btn-primary" href="properties.html">تصفح العقارات</a>
        </div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>

  <script type="module" src="/assets/js/favorites.js"></script>
</body>
</html>
